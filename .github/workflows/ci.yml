name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ github.sha }}
          path: lib
          retention-days: 1
      - run: git diff --exit-code

  publish:
    needs: verify
    # 本仓库是 fork：push 事件不触发 Actions，通过 workflow_dispatch（main ref）驱动发布。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@v4
        with:
          name: lib-${{ github.sha }}
          path: lib
      - name: 发布到 npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@xixka/dsh-share@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "@xixka/dsh-share@$PACKAGE_VERSION already published; skipping npm publish"
          else
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$NPM_CONFIG_USERCONFIG"
            PACK_REPORT="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json)"
            TARBALL="$RUNNER_TEMP/$(node -p "JSON.parse(process.argv[1])[0].filename" "$PACK_REPORT")"
            npm publish "$TARBALL" --ignore-scripts --access public
            rm -f "$NPM_CONFIG_USERCONFIG"
          fi
